[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "pyansys-geometry-mcp"
version = "0.1.0"
description = "MCP server for PyAnsys Geometry"
readme = "README.rst"
keywords = [
  "ai",
  "ansys",
  "assistant",
  "mcp",
  "model-context-protocol",
]
license = "MIT"
maintainers = [
  { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" },
]
authors = [
  { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" },
]
requires-python = ">=3.10,<4"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "ansys-common-mcp>=0.2.0",
  "ansys-geometry-core[all]>=0.15.0",
  "black",
  "isort",
]
urls.Documentation = "https://pyansys-geometry-mcp.docs.pyansys.com/"
urls.Homepage = "https://github.com/ansys-internal/pyansys-geometry-mcp"
urls.Issues = "https://github.com/ansys-internal/pyansys-geometry-mcp/issues"
urls.Repository = "https://github.com/ansys-internal/pyansys-geometry-mcp"
scripts.pyansys-geometry-mcp = "ansys.geometry.mcp.__main__:main"

[dependency-groups]
# NOTE: The `dependency-groups` section is used to define groups of dependencies
# only available when a developer clones the repository and installs the package
# for local development.
dev = [
  "pre-commit==4.6.0",
  { include-group = "doc" },
  { include-group = "tests" },
]
doc = [
  "ansys-sphinx-theme>=0.14",
  "pypdf>=4.0",
  "sphinx>=7.0",
  "sphinx-click>=5.0",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.5",
  "sphinx-jinja>=0.2",
]
tests = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "pytest-cov>=4.0",
  "pytest-mock>=3.10",
]

[tool.hatch]
build.targets.editable.packages = [ "src/ansys/geometry/mcp" ]
build.targets.editable.sources."src/ansys/geometry/mcp" = "ansys/geometry/mcp"
build.targets.wheel.packages = [ "src/ansys/geometry/mcp" ]
build.targets.wheel.sources."src/ansys/geometry/mcp" = "ansys/geometry/mcp"

[tool.uv]
default-groups = []
package = true

[tool.ruff]
line-length = 100
fix = true
format.indent-style = "space"
format.quote-style = "double"
format.docstring-code-line-length = "dynamic"
format.docstring-code-format = true
lint.select = [
  "D",   # pydocstyle
  "I",   # isort
  "PTH", # flake8-use-pathlib
  "TD",  # flake8-todos
]
lint.isort.combine-as-imports = true
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "ansys.geometry.mcp" ]
lint.per-file-ignores."tests/**/*.py" = [ "D" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.python_files = "test_*.py"
ini_options.python_classes = "Test*"
ini_options.python_functions = "test_*"
ini_options.asyncio_mode = "auto"
ini_options.addopts = [
  "--verbose",
  "--cov=ansys.geometry.mcp",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
]

[tool.coverage]
run.omit = [ "*/__pycache__/*" ]
run.source = [ "src" ]

[tool.pydocstyle]
convention = "numpy"
add_ignore = [ "D100", "D104" ]
