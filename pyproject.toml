[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "pyansys-geometry-mcp"
version = "0.1.0"
description = "MCP server for PyAnsys Geometry"
readme = "README.rst"
keywords = [
  "ai",
  "ansys",
  "assistant",
  "mcp",
  "model-context-protocol",
]
license = "MIT"
maintainers = [
  { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" },
]
authors = [
  { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" },
]
requires-python = ">=3.12,<4"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "ansys-common-mcp>=0.2.0",
  "ansys-geometry-core[all]>=0.17.0",
  "black",
  "isort",
]
urls.Documentation = "https://pyansys-geometry-mcp.docs.pyansys.com/"
urls.Homepage = "https://github.com/ansys/pyansys-geometry-mcp"
urls.Issues = "https://github.com/ansys/pyansys-geometry-mcp/issues"
urls.Repository = "https://github.com/ansys/pyansys-geometry-mcp"
scripts.pyansys-geometry-mcp = "ansys.geometry.mcp.__main__:main"

[dependency-groups]
# NOTE: The `dependency-groups` section is used to define groups of dependencies
# only available when a developer clones the repository and installs the package
# for local development.
dev = [
  "pre-commit==4.6.2",
  { include-group = "doc" },
  { include-group = "tests" },
]
doc = [
  "ansys-sphinx-theme>=0.14",
  "pypdf>=4.0",
  "sphinx>=7.0",
  "sphinx-click>=5.0",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.5",
  "sphinx-jinja>=0.2",
]
tests = [
  "pytest>=7.0",
  "pytest-asyncio==1.4.0",
  "pytest-cov>=4.0",
  "pytest-mock>=3.10",
]

[tool.hatch]
build.targets.editable.packages = [ "src/ansys/geometry/mcp" ]
build.targets.editable.sources."src/ansys/geometry/mcp" = "ansys/geometry/mcp"
build.targets.wheel.packages = [ "src/ansys/geometry/mcp" ]
build.targets.wheel.sources."src/ansys/geometry/mcp" = "ansys/geometry/mcp"

[tool.uv]
default-groups = []
package = true

[tool.ruff]
line-length = 100
fix = true
format.indent-style = "space"
format.quote-style = "double"
format.docstring-code-line-length = "dynamic"
format.docstring-code-format = true
lint.select = [
  "D",   # pydocstyle
  "I",   # isort
  "PTH", # flake8-use-pathlib
  "TD",  # flake8-todos
]
lint.ignore = [
  "D213", # Multi-line docstring summary should start at the second line (conflicts with D212/numpy convention)
]
lint.per-file-ignores."tests/**/*.py" = [ "D" ]
lint.isort.combine-as-imports = true
lint.isort.force-sort-within-sections = true
lint.isort.known-first-party = [ "ansys.geometry.mcp" ]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.python_files = "test_*.py"
ini_options.python_classes = "Test*"
ini_options.python_functions = "test_*"
ini_options.asyncio_mode = "auto"
ini_options.addopts = [
  "-ra",
  "--verbose",
  "--cov=ansys.geometry.mcp",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
]

[tool.coverage]
run.omit = [ "*/__main__.py", "*/__pycache__/*" ]
run.source = [ "src" ]

[tool.towncrier]
directory = "doc/changelog.d"
filename = "doc/source/changelog.rst"
start_string = ".. towncrier release notes start\n"
template = "doc/changelog.d/changelog_template.jinja"
title_format = "`{version} <https://github.com/ansys/pyansys-geometry/releases/tag/v{version}>`_ - {project_date}"
issue_format = "`#{issue} <https://github.com/ansys/pyansys-geometry/pull/{issue}>`_"
type = [
  { directory = "breaking", name = "Breaking", showcontent = true },
  { directory = "added", name = "Added", showcontent = true },
  { directory = "fixed", name = "Fixed", showcontent = true },
  { directory = "documentation", name = "Documentation", showcontent = true },
  { directory = "dependencies", name = "Dependencies", showcontent = true },
  { directory = "maintenance", name = "Maintenance", showcontent = true },
  { directory = "miscellaneous", name = "Miscellaneous", showcontent = true },
  { directory = "test", name = "Test", showcontent = true },
]

[tool.pydocstyle]
convention = "numpy"
add_ignore = [ "D100", "D104" ]
