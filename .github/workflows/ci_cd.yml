name: GitHub CI
on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "*"
    branches:
      - main

env:
  MAIN_PYTHON_VERSION: '3.14'
  PACKAGE_NAME: 'ansys-geometry-mcp'
  DOCUMENTATION_CNAME: 'geometry-mcp.docs.pyansys.com'
  ANSRV_GEO_IMAGE: 'ghcr.io/ansys/geometry'
  ANSRV_GEO_IMAGE_DOCS_TAG: ghcr.io/ansys/geometry:core-linux-latest
  ANSRV_GEO_PORT: 700
  ANSRV_GEO_LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
  GEO_CONT_NAME: ans_geo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # Needs access to the Geometry docker image
  pull-requests: read # Required to read PR content

jobs:

  update-changelog:
    name: "Update CHANGELOG (on release)"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to read and write repository contents
      pull-requests: write # Needed to create pull requests
    steps:
      - uses: ansys/actions/doc-deploy-changelog@a5c8d0d92928e144130a3c64aa7200b9547785de #v11.1.3
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  vulnerabilities:
    name: "Vulnerabilities"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/check-vulnerabilities@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          python-package-name: ${{ env.PACKAGE_NAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          dev-mode: ${{ github.ref != 'refs/heads/main' }}
          hide-log: false

  actions-security:
    name: "Actions Security"
    runs-on: ubuntu-latest
    steps:
      - uses: ansys/actions/check-actions-security@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          generate-summary: true
          token: ${{ secrets.GITHUB_TOKEN }}
          auditing-level: 'high'

  pr-name:
    if: github.event_name == 'pull_request'
    name: "Check the name of the PR"
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: ansys/actions/check-pr-title@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  code-style:
    name: "Code Style"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: ansys/actions/code-style@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  docs-style:
    name: "Documentation Style Check"
    runs-on: ubuntu-latest
    steps:
      - name: PyAnsys documentation style checks
        uses: ansys/actions/doc-style@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: "Build Documentation"
    needs: [docs-style]
    runs-on: ubuntu-latest
    steps:
      - name: "Set up headless display"
        uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79 # v5.1.0

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Pull and launch geometry service"
        env:
          TRANSPORT_MODE_SELECTION: ${{ secrets.TRANSPORT_MODE_SELECTION }}
        run: |
          docker pull ${ANSRV_GEO_IMAGE_DOCS_TAG}
          docker run --detach --name ${GEO_CONT_NAME} -e LICENSE_SERVER=${ANSRV_GEO_LICENSE_SERVER} -p ${ANSRV_GEO_PORT}:50051 ${ANSRV_GEO_IMAGE_DOCS_TAG} ${TRANSPORT_MODE_SELECTION}

      - name: "Run Ansys documentation building action"
        uses: ansys/actions/doc-build@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          add-pdf-html-docs-as-assets: false
          needs-quarto: false
          dependencies: 'pandoc'
          sphinxopts: '-j 1 -W --color'
          group-dependencies-name: "doc"

      - name: "Stop the Geometry service"
        if: always()
        run: |
          docker stop ${GEO_CONT_NAME}
          docker logs ${GEO_CONT_NAME}
          docker rm ${GEO_CONT_NAME}

  doc-deploy-pr:
    name: "Deploy PR documentation"
    if: contains(github.event.pull_request.labels.*.name, 'deploy-pr-doc')
    needs: [docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to update files on the gh-pages branch
      pull-requests: write # Needed to create deployment comments on PRs
    steps:
      - uses: ansys/actions/doc-deploy-pr@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
          cname: ${{ env.DOCUMENTATION_CNAME }}
          maximum-pr-doc-deployments: 5
          token: ${{ secrets.GITHUB_TOKEN }}

  testing-windows:
    name: "Testing and coverage (Windows) (${{ matrix.tracker-label }})"
    runs-on: windows-latest
    env:
      SKIP_UNSTABLE: false
    strategy:
      fail-fast: false
      matrix:
        use-tracker: ["no", "yes"]
        include:
          # Add tracker-label based on use-tracker
          - use-tracker: "no"
            tracker-label: "Without tracker"
          - use-tracker: "yes"
            tracker-label: "With tracker"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Setup UV"
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          activate-environment: true
          enable-cache: false

      - name: "Set up headless display"
        uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79 # v5.1.0

      - name: "Install packages for testing"
        run: uv sync --group tests

      - name: "Ensure Docker service is running"
        if: env.SKIP_UNSTABLE == 'false'
        run: |
          $maxRetries = 6
          for ($i = 1; $i -le $maxRetries; $i++) {
            Start-Service docker -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 10
            if ((docker info 2>&1 | Out-String) -notmatch 'error') { break }
            if ($i -eq $maxRetries) { Write-Error "Docker failed to start after $maxRetries attempts"; exit 1 }
            Write-Host "Docker not ready yet (attempt $i/$maxRetries), retrying..."
          }
          Write-Host "Docker is ready"

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download Geometry service container (if needed)"
        env:
          FULL_IMAGE_NAME: "${{ env.ANSRV_GEO_IMAGE }}:core-windows-latest"
        run: |
          Write-Host "Pulling Docker image: $env:FULL_IMAGE_NAME"
          docker pull $env:FULL_IMAGE_NAME

      - name: "Start Geometry service and verify start"
        env:
          FULL_IMAGE_NAME: "${{ env.ANSRV_GEO_IMAGE }}:core-windows-latest"
          PORT_MAPPING: "${{ env.ANSRV_GEO_PORT }}:50051"
          TRANSPORT_MODE_SELECTION: ${{ secrets.TRANSPORT_MODE_SELECTION }}
        run: |
          # Write command to file launch.txt for sanitizing purposes
          echo "docker run --detach --name $env:GEO_CONT_NAME -e LICENSE_SERVER=$env:ANSRV_GEO_LICENSE_SERVER -p $env:PORT_MAPPING $env:FULL_IMAGE_NAME $env:TRANSPORT_MODE_SELECTION" | Out-File -FilePath launch.txt
          # Read the file and execute the command
          $command = Get-Content -Path launch.txt | Select-String -Pattern "docker run"
          Invoke-Expression $command.Line
          Start-Sleep -Seconds 10
          uv run python -c "from ansys.geometry.core.connection.validate import validate; validate()"

      - name: "Testing"
        timeout-minutes: 20 # Sometimes hangs...
        env:
          USE_TRACKER: ${{ matrix.use-tracker }}
        run: uv run pytest -v --use-tracker=$env:USE_TRACKER

      - name: "Upload integration test logs"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-logs-${{ matrix.use-tracker }}
          path: tests/logs/integration_tests_logs.txt
          retention-days: 7

      - name: "Upload Coverage Results"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: true
          name: coverage-html-${{ matrix.use-tracker }}
          path: .cov/html
          retention-days: 7

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: .cov/xml

      - name: "Stop the Geometry service"
        if: always()
        run: |
          if ( "$env:SKIP_UNSTABLE" -match 'false')
          {
            docker stop $env:GEO_CONT_NAME
            docker logs $env:GEO_CONT_NAME
            docker rm $env:GEO_CONT_NAME
          }

  testing-linux:
    name: "Testing and coverage (Linux) (${{ matrix.tracker-label }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use-tracker: ["no", "yes"]
        include:
          # Add tracker-label based on use-tracker
          - use-tracker: "no"
            tracker-label: "Without tracker"
          - use-tracker: "yes"
            tracker-label: "With tracker"

    steps:
      - name: "Set up headless display"
        uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79 # v5.1.0

      - name: "Login in GitHub Container registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Pull and launch geometry service"
        env:
          FULL_IMAGE_NAME: "${{ env.ANSRV_GEO_IMAGE }}:core-linux-latest"
          TRANSPORT_MODE_SELECTION: ${{ secrets.TRANSPORT_MODE_SELECTION }}
        run: |
          echo "Pulling Docker image: ${FULL_IMAGE_NAME}"
          docker pull ${FULL_IMAGE_NAME}
          docker run --detach --name ${GEO_CONT_NAME} -e LICENSE_SERVER=${ANSRV_GEO_LICENSE_SERVER} -p ${ANSRV_GEO_PORT}:50051 ${FULL_IMAGE_NAME} ${TRANSPORT_MODE_SELECTION}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run pytest"
        uses: ansys/actions/tests-pytest@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        env:
          ALLOW_PLOTTING: true
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          pytest-extra-args: "--use-tracker=${{ matrix.use-tracker }}"
          checkout: false
          randomize: true
          group-dependencies-name: "tests"

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: .cov/xml

      - name: "Upload integration test logs"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-logs-${{ matrix.use-tracker }}
          path: tests/logs/integration_tests_logs.txt
          retention-days: 7

      - name: "Stop the Geometry service"
        if: always()
        run: |
          docker stop ${GEO_CONT_NAME}
          docker logs ${GEO_CONT_NAME}
          docker rm ${GEO_CONT_NAME}

  package:
    name: "Package library"
    needs: [testing-windows, testing-linux, docs]
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Required to upload provenance attestations
      contents: read
      id-token: write # Required for OIDC authentication to upload provenance attestations
    steps:
      - name: Build library source and wheel artifacts
        uses: ansys/actions/build-library@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          attest-provenance: true

  upload_dev_docs:
    name: "Upload dev documentation"
    if: github.ref == 'refs/heads/main'
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push to the documentation branch (gh-pages)
    steps:
      - name: "Deploy the latest documentation"
        uses: ansys/actions/doc-deploy-dev@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  release:
    name: "Release project to GitHub and PyPI"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    needs: [package, docs, update-changelog]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Required for GitHub release
      contents: write # Required for GitHub release
    steps:
      - name: "Release to GitHub"
        uses: ansys/actions/release-github@a5c8d0d92928e144130a3c64aa7200b9547785de #v11.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          library-name: ${{ env.PACKAGE_NAME }}
          add-artifact-attestation-notes: true
          changelog-release-notes: true

      - name: "Release to PyPI"
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: dist/${{ env.PACKAGE_NAME }}-artifacts
          skip-existing: false

  doc-deploy-stable:
    name: "Deploy stable documentation"
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push documentation to gh-pages branch
    needs: [release]
    steps:
      - name: "Deploy the stable documentation"
        uses: ansys/actions/doc-deploy-stable@a5c8d0d92928e144130a3c64aa7200b9547785de #v11.1.3
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          render-last: '5'
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  automerge-prs:
    name: "Automerge PRs (from dependabot)"
    runs-on: ubuntu-latest
    needs: [package]
    if: github.event_name == 'pull_request'
    permissions:
      contents: write # Required to allow automerge
      pull-requests: write # Required to allow automerge
    steps:
      - name: "Automerge PRs"
        uses: ansys/actions/hk-automerge-prs@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          approver: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          approver-token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
