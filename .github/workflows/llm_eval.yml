name: LLM tool discoverability

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Number of times each prompt is sent to the model"
        required: false
        default: "5"
      threshold:
        description: "Minimum fraction of repeats that must select the expected tool"
        required: false
        default: "0.8"
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 04:00 UTC

env:
  MAIN_PYTHON_VERSION: '3.14'
  ANSRV_GEO_IMAGE: 'ghcr.io/ansys/geometry'
  ANSRV_GEO_PORT: 700
  ANSRV_GEO_LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
  GEO_CONT_NAME: ans_geo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # Needs access to the Geometry docker image

jobs:
  tool-discoverability:
    name: Tool discoverability evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Login in GitHub Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and launch geometry service
        env:
          FULL_IMAGE_NAME: "${{ env.ANSRV_GEO_IMAGE }}:core-linux-latest"
          TRANSPORT_MODE_SELECTION: ${{ secrets.TRANSPORT_MODE_SELECTION }}
        run: |
          echo "Pulling Docker image: ${FULL_IMAGE_NAME}"
          docker pull ${FULL_IMAGE_NAME}
          docker run --detach --name ${GEO_CONT_NAME} -e LICENSE_SERVER=${ANSRV_GEO_LICENSE_SERVER} -p ${ANSRV_GEO_PORT}:50051 ${FULL_IMAGE_NAME} ${TRANSPORT_MODE_SELECTION}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          activate-environment: true
          enable-cache: true

      - name: Install packages for the evaluation
        run: uv sync --group eval

      - name: Run the evaluation
        timeout-minutes: 45
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          GEOMETRY_SERVICE_PORT: ${{ env.ANSRV_GEO_PORT }}
          REPEATS: ${{ inputs.repeats || '5' }}
          THRESHOLD: ${{ inputs.threshold || '0.8' }}
        run: |
          uv run pytest tests/eval -v --no-cov \
            --junitxml=tests/logs/llm_eval_junit.xml \
            --run-llm-eval \
            --use-existing-service=yes \
            --llm-eval-repeats="${REPEATS}" \
            --llm-eval-threshold="${THRESHOLD}"

      - name: Collect failed test names
        id: collect-failed-test-names
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("tests/logs/llm_eval_junit.xml")
          failed_tests = []
          if report.exists():
              for testcase in ET.parse(report).iter("testcase"):
                  if testcase.find("failure") is not None or testcase.find("error") is not None:
                      classname = testcase.get("classname", "")
                      name = testcase.get("name", "unknown test")
                      failed_tests.append(f"{classname}::{name}" if classname else name)

          message = (
              "Failed tests:\n" + "\n".join(f"- {name}" for name in failed_tests)
              if failed_tests
              else "No failing test names were captured."
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"message={json.dumps(message)}\n")
          PY

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llm-eval-report
          path: tests/logs/llm_eval_report.json
          retention-days: 30

      - name: Stop the Geometry service
        if: always()
        run: |
          docker stop ${GEO_CONT_NAME}
          docker logs ${GEO_CONT_NAME}
          docker rm ${GEO_CONT_NAME}

      - name: Microsoft Teams Notification
        if: failure()
        uses: skitionek/notify-microsoft-teams@944af5529de00d798bc68b8d1c15d8da66c1a4d7 # v1.3.5
        with:
          webhook_url: ${{ secrets.MSTEAMS_WEBHOOK }}
          # Message to send to Teams as a webhook notification in JSON Payload format
          raw: >-
            {
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.0",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": ${{ steps.collect-failed-test-names.outputs.message
            }},
                        "wrap": true
                      },
                      {
                        "type": "TextBlock",
                        "text": "[View details in GitHub Actions](https://github.com/ansys/pyansys-geometry/actions/runs/${{
            github.run_id }})",
                        "wrap": true
                      }
                    ]
                  }
                }
              ]
            }
